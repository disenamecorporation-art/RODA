    <script>
      (function() {
        try {
          var _originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _originalFetch;
            },
            set: function(val) {
              _originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not redefine fetch property:", e);
        }
      })();
    </script>
